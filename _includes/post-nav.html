<nav class="post-nav" aria-label="Más entradas">
  {% if page.previous %}
    <a class="post-nav__prev" href="{{ page.previous.url | relative_url }}">
      <span>← Anterior</span>
      {{ page.previous.title }}
    </a>
  {% endif %}
  {% if page.next %}
    <a class="post-nav__next" href="{{ page.next.url | relative_url }}">
      <span>Siguiente →</span>
      {{ page.next.title }}
    </a>
  {% endif %}
</nav>
