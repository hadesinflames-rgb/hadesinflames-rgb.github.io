title: Hades in Flames
description: Un blog de música sin etiquetas, del pop al metal
author: Dani Martínez
lang: es
timezone: Europe/Madrid

url: "https://hadesinflames-rgb.github.io"
baseurl: ""

permalink: /:year/:month/:title/
markdown: kramdown

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
